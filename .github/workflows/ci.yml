name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate manifest and notices
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Build release package
        run: npm run build
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: knkr-pathing-package
          path: |
            dist/knkr-pathing-v*.zip
            dist/module.json
          if-no-files-found: error
